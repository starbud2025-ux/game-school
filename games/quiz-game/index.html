<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퀴즈 게임</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; width: 100%; max-width: 600px; }
    header a { color: #a0c4ff; text-decoration: none; font-size: 0.9rem; }
    header a:hover { text-decoration: underline; }
    h1 { font-size: 1.8rem; flex: 1; text-align: center; }
    #quiz-box {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
    }
    #progress { color: #a0c4ff; font-size: 0.85rem; margin-bottom: 12px; }
    #question { font-size: 1.25rem; line-height: 1.6; margin-bottom: 24px; }
    .choices { display: flex; flex-direction: column; gap: 10px; }
    .choice {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 14px 18px;
      cursor: pointer;
      font-size: 1rem;
      text-align: left;
      color: #fff;
      transition: background 0.2s;
    }
    .choice:hover:not(:disabled) { background: rgba(100,180,255,0.2); }
    .choice.correct { background: rgba(100,220,100,0.3); border-color: #7fff7f; }
    .choice.wrong { background: rgba(220,80,80,0.3); border-color: #ff8080; }
    #feedback { margin-top: 16px; min-height: 1.5em; font-size: 0.95rem; color: #a0c4ff; }
    #next-btn {
      display: none;
      margin-top: 20px;
      padding: 10px 28px;
      background: #0f3460;
      color: #fff;
      border: 1px solid #a0c4ff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    #next-btn:hover { background: #1a4a80; }
    #result { text-align: center; font-size: 1.3rem; }
    #result p { margin: 10px 0; color: #a0c4ff; }
    #restart-btn {
      margin-top: 20px;
      padding: 10px 28px;
      background: #0f3460;
      color: #fff;
      border: 1px solid #a0c4ff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    #restart-btn:hover { background: #1a4a80; }
  </style>
</head>
<body>
  <header>
    <a href="../../">← 목록으로</a>
    <h1>❓ 퀴즈 게임</h1>
  </header>
  <div id="quiz-box"></div>

  <script>
    const quizzes = [
      { q: "대한민국의 수도는?", choices: ["부산", "서울", "인천", "대구"], answer: 1 },
      { q: "1 + 1 = ?", choices: ["1", "2", "3", "4"], answer: 1 },
      { q: "태양계에서 가장 큰 행성은?", choices: ["토성", "지구", "목성", "화성"], answer: 2 },
      { q: "물의 화학식은?", choices: ["CO2", "O2", "H2O", "NaCl"], answer: 2 },
      { q: "한국어로 'apple'은?", choices: ["바나나", "사과", "포도", "딸기"], answer: 1 },
      { q: "세계에서 가장 높은 산은?", choices: ["백두산", "한라산", "에베레스트", "후지산"], answer: 2 },
      { q: "1년은 몇 개월?", choices: ["10", "11", "12", "13"], answer: 2 },
      { q: "빛의 속도는 약 초속 몇 km?", choices: ["3만", "30만", "300만", "3000만"], answer: 1 },
    ];

    let current = 0, score = 0, answered = false;

    function render() {
      const box = document.getElementById('quiz-box');
      if (current >= quizzes.length) {
        box.innerHTML = `
          <div id="result">
            <div style="font-size:2.5rem">🏆</div>
            <h2 style="margin:12px 0">퀴즈 완료!</h2>
            <p>${quizzes.length}문제 중 <strong>${score}문제</strong> 정답</p>
            <p>${score >= quizzes.length * 0.8 ? '🌟 훌륭해요!' : score >= quizzes.length * 0.5 ? '👍 잘했어요!' : '💪 다시 도전해봐요!'}</p>
            <button id="restart-btn" onclick="restart()">다시 하기</button>
          </div>`;
        return;
      }
      const q = quizzes[current];
      answered = false;
      box.innerHTML = `
        <div id="progress">${current + 1} / ${quizzes.length}  |  점수: ${score}</div>
        <div id="question">${q.q}</div>
        <div class="choices">
          ${q.choices.map((c, i) => `<button class="choice" onclick="pick(${i})">${c}</button>`).join('')}
        </div>
        <div id="feedback"></div>
        <button id="next-btn" onclick="next()">다음 문제 →</button>`;
    }

    function pick(i) {
      if (answered) return;
      answered = true;
      const q = quizzes[current];
      const btns = document.querySelectorAll('.choice');
      btns.forEach(b => b.disabled = true);
      btns[i].classList.add(i === q.answer ? 'correct' : 'wrong');
      if (i !== q.answer) btns[q.answer].classList.add('correct');
      document.getElementById('feedback').textContent =
        i === q.answer ? '✅ 정답입니다!' : `❌ 오답! 정답은 "${q.choices[q.answer]}"`;
      if (i === q.answer) score++;
      document.getElementById('next-btn').style.display = 'inline-block';
    }

    function next() { current++; render(); }
    function restart() { current = 0; score = 0; render(); }

    render();
  </script>
</body>
</html>
