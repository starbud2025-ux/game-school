<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>용기 팝콘 모자 🎩</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: '맑은 고딕', 'Segoe UI', sans-serif;
      background: radial-gradient(ellipse at 50% -5%, #3d1a6e 0%, #1a0a2e 55%, #0d0520 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header { padding: 16px 20px 4px; text-align: center; width: 100%; }
    header a { color: #c084fc; text-decoration: none; font-size: 0.9rem; }
    header a:hover { text-decoration: underline; }
    h1 { color: #fff; font-size: clamp(1.4rem, 4vw, 2rem); margin-top: 6px; text-shadow: 0 0 30px rgba(192,132,252,.7); }
    .sub { color: #c084fc; font-size: clamp(.85rem, 2.5vw, 1rem); margin-top: 5px; }

    /* ── Hat ── */
    #hat-wrap {
      position: relative;
      width: 260px; height: 280px;
      flex-shrink: 0; margin-top: 12px;
    }
    #hat-svg { width: 100%; height: 100%; }

    @keyframes hatShake {
      0%,100% { transform: rotate(0) translateX(0); }
      25%      { transform: rotate(-7deg) translateX(-5px); }
      75%      { transform: rotate(7deg)  translateX(5px); }
    }

    /* Ghost words window (positioned over hat body) */
    #ghost-win {
      position: absolute;
      left: 22%; top: 27%; width: 56%; height: 46%;
      overflow: hidden; pointer-events: none;
      display: flex; flex-direction: row; flex-wrap: wrap;
      align-items: center; justify-content: center;
      gap: 4px; padding: 6px;
      border-radius: 4px;
      background: rgba(8, 2, 25, 0.45);
      transition: box-shadow .4s;
    }
    #ghost-win.lit {
      box-shadow: inset 0 0 18px rgba(192,132,252,.4), inset 0 0 6px rgba(192,132,252,.2);
    }

    .ghost-tag {
      font-size: 0.66rem; font-weight: 700;
      color: rgba(225, 200, 255, 0.92);
      text-shadow: 0 0 7px #c084fc, 0 0 14px rgba(192,132,252,.5);
      background: rgba(110, 50, 210, 0.35);
      border-radius: 6px; padding: 2px 6px;
      white-space: nowrap;
      animation: ghostIn .45s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes ghostIn {
      from { opacity: 0; transform: scale(0.2); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Sparkle layer */
    #sp-layer { position: absolute; inset: 0; pointer-events: none; }
    .sp { position: absolute; font-size: 1.2rem; pointer-events: none; animation: spOut .9s ease-out forwards; }
    @keyframes spOut {
      0%  { opacity: 0; transform: scale(0) translate(0,0); }
      35% { opacity: 1; transform: scale(1.5) translate(var(--mx),var(--my)); }
      100%{ opacity: 0; transform: scale(.2) translate(var(--ex),var(--ey)); }
    }

    /* ── Input area ── */
    #input-area {
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; margin-top: 14px; padding: 0 24px;
      width: 100%; max-width: 380px;
    }
    #input-area label { color: #e2c4ff; font-size: clamp(.9rem, 2.5vw, 1.05rem); }
    #word-input {
      width: 100%; padding: 13px 16px;
      font-size: clamp(1.05rem, 3vw, 1.2rem); font-family: inherit;
      border: 2.5px solid #8b5cf6; border-radius: 16px;
      background: rgba(255,255,255,.08); color: #fff;
      text-align: center; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    #word-input::placeholder { color: rgba(255,255,255,.35); }
    #word-input:focus { border-color: #ffd700; box-shadow: 0 0 16px rgba(255,215,0,.2); }
    #word-input:disabled { opacity: .5; }

    #add-btn {
      width: 100%; padding: 13px;
      font-size: clamp(1rem, 3vw, 1.15rem); font-weight: 700; font-family: inherit;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff; border: none; border-radius: 16px; cursor: pointer;
      box-shadow: 0 4px 18px rgba(124,58,237,.5);
      transition: transform .15s, box-shadow .15s;
    }
    #add-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(168,85,247,.6); }
    #add-btn:disabled { opacity: .4; cursor: default; transform: none; }

    /* ── 용기 팡팡 button ── */
    #bang-btn {
      margin-top: 14px;
      padding: 17px 52px;
      font-size: clamp(1.15rem, 3.5vw, 1.5rem); font-weight: 800; font-family: inherit;
      background: linear-gradient(135deg, #ea580c, #f59e0b);
      color: #fff; border: none; border-radius: 20px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(234,88,12,.5);
      transition: transform .15s, box-shadow .15s;
    }
    #bang-btn:hover:not(:disabled) { transform: translateY(-3px) scale(1.04); box-shadow: 0 8px 30px rgba(245,158,11,.6); }
    #bang-btn:disabled { opacity: .3; cursor: default; transform: none; animation: none; }
    #bang-btn:not(:disabled) { animation: btnPulse 1.6s ease-in-out infinite; }
    @keyframes btnPulse {
      0%,100% { box-shadow: 0 4px 20px rgba(234,88,12,.5); }
      50%      { box-shadow: 0 4px 32px rgba(245,158,11,.8), 0 0 0 7px rgba(245,158,11,.15); }
    }

    /* ── Flying card ── */
    #fly-card {
      position: fixed; z-index: 500;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: #fff; border: 3px solid #8b5cf6; border-radius: 16px;
      padding: 10px 20px; pointer-events: none;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
      transform-origin: center center;
    }
    .card-emo  { font-size: 1.7rem; line-height: 1; }
    .card-word { font-size: 1.35rem; font-weight: 800; color: #2d1060; margin-top: 4px; }

    /* ── Popcorn overlay ── */
    #pop-area { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
    .corn {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 14px;
      font-weight: 800; color: #3a1400;
      white-space: pre-line; line-height: 1.3; word-break: keep-all;
      box-shadow: 0 6px 22px rgba(0,0,0,.38), inset 0 2px 8px rgba(255,255,255,.5);
      opacity: 0;
    }

    /* ── Reset ── */
    #reset-btn {
      display: none; margin: 18px auto 40px;
      padding: 13px 38px;
      font-size: clamp(.95rem, 2.5vw, 1.05rem); font-family: inherit; font-weight: 600;
      background: rgba(255,255,255,.08); color: #e2c4ff;
      border: 2px solid rgba(192,132,252,.4); border-radius: 16px; cursor: pointer;
      transition: background .2s;
    }
    #reset-btn:hover { background: rgba(192,132,252,.15); }
    #reset-btn.show { display: block; }

    .spacer { height: 28px; }
  </style>
</head>
<body>

<header>
  <a href="../../">← 게임 목록으로</a>
  <h1>🎩 용기 팝콘 모자</h1>
  <p class="sub">무서운 것들을 모아서 용기로 바꿔요!</p>
</header>

<!-- Hat -->
<div id="hat-wrap">
  <svg id="hat-svg" viewBox="0 0 280 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bg" cx="30%" cy="20%" r="75%">
        <stop offset="0%" stop-color="#6832c0"/>
        <stop offset="100%" stop-color="#2d1060"/>
      </radialGradient>
      <radialGradient id="br" cx="30%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#3d1580"/>
        <stop offset="100%" stop-color="#1a0740"/>
      </radialGradient>
    </defs>
    <ellipse cx="140" cy="266" rx="128" ry="14" fill="rgba(0,0,0,.4)"/>
    <ellipse cx="140" cy="258" rx="126" ry="17" fill="#110530"/>
    <ellipse cx="140" cy="253" rx="123" ry="14" fill="url(#br)"/>
    <rect x="60" y="72" width="160" height="183" rx="4" fill="url(#bg)"/>
    <rect x="60" y="72" width="16"  height="183" rx="4" fill="rgba(255,255,255,.07)"/>
    <rect x="60" y="220" width="160" height="22" rx="2" fill="#1a0740"/>
    <rect x="60" y="220" width="160" height="9"  rx="2" fill="rgba(192,132,252,.22)"/>
    <text x="76"  y="128" font-size="24" fill="#ffd700" opacity=".9">★</text>
    <text x="184" y="174" font-size="20" fill="#ffd700" opacity=".85">✦</text>
    <text x="88"  y="200" font-size="14" fill="#ffd700" opacity=".7">★</text>
    <text x="166" y="113" font-size="16" fill="#ffd700" opacity=".8">✦</text>
    <text x="148" y="158" font-size="10" fill="#ffd700" opacity=".45">★</text>
    <ellipse cx="120" cy="231" rx="17" ry="10" fill="#a855f7" opacity=".9"/>
    <ellipse cx="160" cy="231" rx="17" ry="10" fill="#a855f7" opacity=".9"/>
    <circle  cx="140" cy="230" r="9"  fill="#c084fc"/>
    <circle  cx="140" cy="230" r="5"  fill="#e9d5ff"/>
    <ellipse cx="140" cy="73" rx="77" ry="10" fill="#0d0522"/>
    <ellipse cx="140" cy="71" rx="77" ry="4.5" fill="rgba(100,60,200,.35)"/>
  </svg>
  <div id="ghost-win"></div>
  <div id="sp-layer"></div>
</div>

<!-- Input -->
<div id="input-area">
  <label for="word-input">무서운 것을 써보세요</label>
  <input id="word-input" type="text" placeholder="예: 어둠, 시험, 발표…"
         maxlength="15" autocomplete="off" spellcheck="false"/>
  <button id="add-btn" onclick="addWord()">🎩 모자에 넣기</button>
</div>

<button id="bang-btn" disabled onclick="bang()">🍿 용기 팡팡!</button>
<button id="reset-btn" onclick="doReset()">🔄 다시 하기</button>
<div class="spacer"></div>

<!-- Flying card (hidden, animated in JS) -->
<div id="fly-card">
  <div class="card-emo">😨</div>
  <div class="card-word"></div>
</div>

<div id="pop-area"></div>

<script>
'use strict';

/* ── Courage messages (fixed 10) ─────────────────────────── */
const COURAGE = [
  '할 수 있어',
  '괜찮아',
  '천천히\n해보자',
  '그런 나도\n좋아',
  '나는 매일\n성장 중',
  '다시\n도전해볼래',
  '나를 믿어',
  '나를\n사랑해',
  '나는\n용기 있어',
  '칭찬해!\n멋진걸!',
];

/* Popcorn scatter positions (fraction of viewport, 10 slots ringed around center) */
const POS = [
  [0.08, 0.05], [0.34, 0.03], [0.62, 0.03], [0.87, 0.05],
  [0.04, 0.50], [0.88, 0.50],
  [0.08, 0.82], [0.30, 0.87], [0.56, 0.87], [0.82, 0.82],
];

const BLOBS = [
  '58% 42% 52% 48% / 55% 58% 42% 50%',
  '42% 58% 48% 52% / 50% 42% 58% 52%',
  '52% 48% 58% 42% / 45% 55% 48% 58%',
  '48% 52% 42% 58% / 58% 45% 52% 42%',
  '50% 50% 45% 55% / 55% 50% 58% 42%',
  '55% 45% 50% 50% / 42% 55% 50% 58%',
  '45% 55% 55% 45% / 52% 48% 55% 45%',
  '60% 40% 48% 52% / 48% 60% 42% 55%',
  '40% 60% 52% 48% / 55% 40% 58% 45%',
  '50% 50% 58% 42% / 42% 52% 48% 58%',
];

const CORN_BG = [
  ['#fffae0','#ffd747'], ['#fff9cc','#ffd060'], ['#fff5d6','#ffbe40'],
  ['#fffae6','#ffd552'], ['#fff2cc','#ffca30'], ['#fffbcc','#ffd966'],
  ['#fff6d0','#ffcc44'], ['#fffde0','#ffe055'], ['#fff0cc','#ffbc38'],
  ['#fffacc','#ffd755'],
];

/* ── Audio ─────────────────────────────────────────────────── */
let _ac = null;
const getAC = () => _ac || (_ac = new (window.AudioContext || window.webkitAudioContext)());

function playWhoosh() {
  try {
    const c = getAC(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(700, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(200, c.currentTime + 0.35);
    g.gain.setValueAtTime(0.12, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.35);
    o.start(); o.stop(c.currentTime + 0.35);
  } catch(e) {}
}

function playMagic() {
  try {
    const c = getAC();
    [440,554,659,784,1047].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = 'triangle';
      const t = c.currentTime + i * 0.08;
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 1.5, t + 0.12);
      g.gain.setValueAtTime(0.1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.start(t); o.stop(t + 0.3);
    });
  } catch(e) {}
}

function playPop() {
  try {
    const c = getAC();
    const len = Math.floor(c.sampleRate * 0.06);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i/len);
    const src = c.createBufferSource(); src.buffer = buf;
    const flt = c.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = 600;
    const g = c.createGain();
    g.gain.setValueAtTime(0.5, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.1);
    src.connect(flt); flt.connect(g); g.connect(c.destination);
    src.start(); src.stop(c.currentTime + 0.1);
  } catch(e) {}
}

/* ── State ──────────────────────────────────────────────────── */
let busy = false, exploded = false;

/* ── Sparkle helper ─────────────────────────────────────────── */
const SP_SYMS = ['✨','⭐','🌟','💫','★','✦'];
function spawnSp(n) {
  const layer = document.getElementById('sp-layer');
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'sp';
      el.textContent = SP_SYMS[Math.floor(Math.random() * SP_SYMS.length)];
      el.style.left = (10 + Math.random() * 80) + '%';
      el.style.top  = ( 3 + Math.random() * 35) + '%';
      const ang = Math.random() * Math.PI * 2;
      const d1  = 35 + Math.random() * 50, d2 = 70 + Math.random() * 90;
      el.style.setProperty('--mx', (Math.cos(ang)*d1)+'px');
      el.style.setProperty('--my', (Math.sin(ang)*d1-18)+'px');
      el.style.setProperty('--ex', (Math.cos(ang)*d2*1.5)+'px');
      el.style.setProperty('--ey', (Math.sin(ang)*d2-55)+'px');
      layer.appendChild(el);
      setTimeout(() => el.remove(), 950);
    }, i * 90);
  }
}

function shakeHat(count) {
  const hat = document.getElementById('hat-svg');
  hat.style.animation = 'none';
  void hat.offsetWidth;
  hat.style.animation = `hatShake 0.12s ease-in-out ${count}`;
  setTimeout(() => { hat.style.animation = ''; }, count * 120 + 50);
}

/* ── Add word flow ──────────────────────────────────────────── */
function addWord() {
  const inp = document.getElementById('word-input');
  const word = inp.value.trim();
  if (!word || busy || exploded) return;

  busy = true;
  inp.disabled = true;
  inp.blur();
  document.getElementById('add-btn').disabled = true;

  /* Locate hat opening */
  const inpR  = inp.getBoundingClientRect();
  const hatR  = document.getElementById('hat-svg').getBoundingClientRect();
  const hatOpenX = hatR.left + hatR.width * 0.5;
  const hatOpenY = hatR.top  + hatR.height * 0.24;
  const startX   = inpR.left + inpR.width * 0.5;
  const startY   = inpR.top  + inpR.height * 0.5;
  const dx = hatOpenX - startX;
  const dy = hatOpenY - startY;

  /* Set up flying card */
  const card = document.getElementById('fly-card');
  card.querySelector('.card-word').textContent = word;
  const cW = 170, cH = 88;
  Object.assign(card.style, {
    display: 'flex',
    left: (startX - cW/2) + 'px',
    top:  (startY - cH/2) + 'px',
    width: cW + 'px', height: cH + 'px',
    opacity: '0',
    transform: 'translate(0,0) scale(0.3)',
  });

  playWhoosh();

  /* Phase 1 — card appears */
  const a1 = card.animate([
    { opacity: 0, transform: 'translate(0,0) scale(0.3)' },
    { opacity: 1, transform: 'translate(0,0) scale(1)'   },
  ], { duration: 300, fill: 'forwards', easing: 'cubic-bezier(.34,1.56,.64,1)' });

  a1.onfinish = () => {
    /* brief pause so user sees the card */
    setTimeout(() => {
      /* Phase 2 — fly into hat */
      const a2 = card.animate([
        { opacity: 1, transform: 'translate(0,0) scale(1)' },
        { opacity: 0, transform: `translate(${dx}px,${dy}px) scale(0.07)` },
      ], { duration: 620, fill: 'forwards', easing: 'ease-in' });

      a2.onfinish = () => {
        card.style.display = 'none';
        a1.cancel(); a2.cancel();

        addGhostTag(word);
        shakeHat(5);
        spawnSp(3);

        busy = false;
        inp.disabled = false;
        inp.value = '';
        document.getElementById('add-btn').disabled = false;
        document.getElementById('bang-btn').disabled = false;
        inp.focus();
      };
    }, 320);
  };
}

function addGhostTag(word) {
  const win = document.getElementById('ghost-win');
  const tag = document.createElement('span');
  tag.className = 'ghost-tag';
  tag.textContent = word;
  win.appendChild(tag);
  win.classList.add('lit');
  /* Remove oldest if too many */
  const all = win.querySelectorAll('.ghost-tag');
  if (all.length > 10) all[0].remove();
}

/* ── Bang flow ──────────────────────────────────────────────── */
function bang() {
  if (busy || exploded) return;
  exploded = true;

  document.getElementById('add-btn').disabled = true;
  document.getElementById('word-input').disabled = true;
  document.getElementById('bang-btn').disabled = true;

  playMagic();
  shakeHat(12);
  spawnSp(12);

  setTimeout(() => {
    playPop();
    spawnPopcorns();
  }, 1500);
}

function spawnPopcorns() {
  const area = document.getElementById('pop-area');
  area.innerHTML = '';

  const hatR  = document.getElementById('hat-svg').getBoundingClientRect();
  const origX = hatR.left + hatR.width * 0.5;
  const origY = hatR.top  + hatR.height * 0.24;
  const vw = innerWidth, vh = innerHeight;

  /* Responsive popcorn size */
  const sz = Math.min(200, Math.max(138, Math.min(vw * 0.17, vh * 0.23)));
  const fs = sz >= 185 ? '1.5rem' : sz >= 160 ? '1.3rem' : '1.1rem';

  COURAGE.forEach((msg, i) => {
    const [fx, fy] = POS[i];
    const pad = sz / 2 + 10;
    const cx  = Math.max(pad, Math.min(vw - pad, fx * vw));
    const cy  = Math.max(pad, Math.min(vh - pad, fy * vh));
    const tx  = cx - origX, ty = cy - origY;

    const [c1, c2] = CORN_BG[i];
    const div = document.createElement('div');
    div.className = 'corn';
    div.style.cssText = `
      left:${origX - sz/2}px; top:${origY - sz/2}px;
      width:${sz}px; height:${sz}px;
      font-size:${fs};
      border-radius:${BLOBS[i]};
      background: radial-gradient(circle at 38% 32%, ${c1}, ${c2} 70%);
    `;
    div.textContent = msg;
    area.appendChild(div);

    /* Bounce animation */
    const anim = div.animate([
      { opacity: 0, transform: 'translate(0,0) scale(0)' },
      { opacity: 1, transform: `translate(${tx}px,${ty-26}px) scale(1.2)`,  offset: 0.54 },
      { opacity: 1, transform: `translate(${tx}px,${ty+14}px) scale(0.96)`, offset: 0.72 },
      { opacity: 1, transform: `translate(${tx}px,${ty-7}px)  scale(1.04)`, offset: 0.85 },
      { opacity: 1, transform: `translate(${tx}px,${ty}px)    scale(1)` },
    ], { duration: 800 + i * 55, delay: i * 65, fill: 'forwards', easing: 'ease-out' });

    anim.onfinish = () => {
      div.style.cssText += `transform:translate(${tx}px,${ty}px);opacity:1;`;
      anim.cancel();
    };

    if (i > 0) setTimeout(() => playPop(), i * 65);
  });

  setTimeout(() => {
    document.getElementById('reset-btn').classList.add('show');
  }, 1600 + COURAGE.length * 65);
}

/* ── Reset ──────────────────────────────────────────────────── */
function doReset() {
  busy = false; exploded = false;
  document.getElementById('ghost-win').innerHTML = '';
  document.getElementById('ghost-win').classList.remove('lit');
  document.getElementById('pop-area').innerHTML = '';
  document.getElementById('reset-btn').classList.remove('show');
  const inp = document.getElementById('word-input');
  inp.value = ''; inp.disabled = false;
  document.getElementById('add-btn').disabled = false;
  document.getElementById('bang-btn').disabled = true;
  inp.focus();
}

document.getElementById('word-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addWord();
});
</script>
</body>
</html>
