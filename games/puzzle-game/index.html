<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퍼즐 게임</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; width: 100%; max-width: 500px; }
    header a { color: #a0c4ff; text-decoration: none; font-size: 0.9rem; }
    header a:hover { text-decoration: underline; }
    h1 { font-size: 1.8rem; flex: 1; text-align: center; }
    #info { display: flex; gap: 24px; margin-bottom: 20px; font-size: 0.95rem; color: #a0c4ff; }
    #board {
      display: grid;
      gap: 4px;
      margin-bottom: 20px;
    }
    .tile {
      width: 90px; height: 90px;
      background: #16213e;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      font-size: 1.6rem;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .tile:hover:not(.empty) { background: #0f3460; transform: scale(1.04); }
    .tile.empty { background: transparent; border-color: transparent; cursor: default; }
    button {
      padding: 10px 28px;
      background: #0f3460;
      color: #fff;
      border: 1px solid #a0c4ff;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    button:hover { background: #1a4a80; }
    #win-msg { margin-top: 16px; font-size: 1.3rem; color: #7fff7f; display: none; }
  </style>
</head>
<body>
  <header>
    <a href="../../">← 목록으로</a>
    <h1>🧩 퍼즐 게임</h1>
  </header>
  <div id="info">
    <span>이동 횟수: <strong id="moves">0</strong></span>
    <span>시간: <strong id="timer">0</strong>초</span>
  </div>
  <div id="board"></div>
  <button onclick="init()">새 게임</button>
  <div id="win-msg">🎉 완성! 축하합니다!</div>

  <script>
    const SIZE = 4;
    let tiles, moves, startTime, timerInterval;

    function init() {
      moves = 0; document.getElementById('moves').textContent = 0;
      clearInterval(timerInterval); document.getElementById('timer').textContent = 0;
      document.getElementById('win-msg').style.display = 'none';
      tiles = Array.from({length: SIZE * SIZE - 1}, (_, i) => i + 1);
      tiles.push(0);
      do { shuffle(tiles); } while (!isSolvable(tiles));
      startTime = Date.now();
      timerInterval = setInterval(() => {
        document.getElementById('timer').textContent = Math.floor((Date.now() - startTime) / 1000);
      }, 1000);
      render();
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function isSolvable(arr) {
      let inv = 0;
      for (let i = 0; i < arr.length; i++)
        for (let j = i + 1; j < arr.length; j++)
          if (arr[i] && arr[j] && arr[i] > arr[j]) inv++;
      const blankRow = SIZE - 1 - Math.floor(arr.indexOf(0) / SIZE);
      return SIZE % 2 === 1 ? inv % 2 === 0 : (blankRow % 2 === 0) === (inv % 2 === 1);
    }

    function render() {
      const board = document.getElementById('board');
      board.style.gridTemplateColumns = `repeat(${SIZE}, 90px)`;
      board.innerHTML = '';
      tiles.forEach((v, i) => {
        const div = document.createElement('div');
        div.className = 'tile' + (v === 0 ? ' empty' : '');
        div.textContent = v || '';
        if (v) div.onclick = () => move(i);
        board.appendChild(div);
      });
    }

    function move(i) {
      const blank = tiles.indexOf(0);
      const r1 = Math.floor(i / SIZE), c1 = i % SIZE;
      const r2 = Math.floor(blank / SIZE), c2 = blank % SIZE;
      if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return;
      [tiles[i], tiles[blank]] = [tiles[blank], tiles[i]];
      moves++; document.getElementById('moves').textContent = moves;
      render();
      if (tiles.every((v, i) => v === (i === SIZE * SIZE - 1 ? 0 : i + 1))) {
        clearInterval(timerInterval);
        document.getElementById('win-msg').style.display = 'block';
      }
    }

    init();
  </script>
</body>
</html>
